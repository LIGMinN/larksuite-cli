name: Skill Format Check

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Skill Format Check
        run: node scripts/skill-format-check/index.js
